[project]
name = "land-value-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "hypothesis",
    "maturin>=1.5,<2.0",
    "ruff",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "land_value_core"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["data/", "scripts/validate_ocr_accuracy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
