[project]
name = "land-value-research"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "land_value_core"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["data/", "scripts/validate_ocr_accuracy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
