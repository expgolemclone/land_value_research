[package]
name = "land_value_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "land_value_core"
crate-type = ["cdylib", "rlib"]
path = "rust_src/lib.rs"

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
encoding_rs = "0.8"
proj4rs = "0.1"
geographiclib-rs = "0.2"
kiddo = "4"
geojson = "0.24"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
csv = "1"
regex = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
